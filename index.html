<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="back-btn-container">
        <a href="../../index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Portfolio
        </a>
    </div>

    <div class="container">
        <div class="calculator">
            <div class="header">
                <h1>🧮 Calculator</h1>
                <p>Advanced Calculator with History</p>
            </div>

            <div class="calculator-content">
                <!-- Display Section -->
                <div class="display-section">
                    <input type="text" id="display" class="display" placeholder="0" readonly>
                    <div class="previous-operand" id="previousOperand"></div>
                </div>

                <!-- Buttons Section -->
                <div class="buttons-section">
                    <!-- Row 1 -->
                    <button class="btn function-btn" onclick="clearDisplay()">C</button>
                    <button class="btn function-btn" onclick="deleteLast()">DEL</button>
                    <button class="btn function-btn" onclick="appendOperator('/')">÷</button>
                    <button class="btn function-btn" onclick="appendOperator('*')">×</button>

                    <!-- Row 2 -->
                    <button class="btn number-btn" onclick="appendNumber('7')">7</button>
                    <button class="btn number-btn" onclick="appendNumber('8')">8</button>
                    <button class="btn number-btn" onclick="appendNumber('9')">9</button>
                    <button class="btn function-btn" onclick="appendOperator('-')">−</button>

                    <!-- Row 3 -->
                    <button class="btn number-btn" onclick="appendNumber('4')">4</button>
                    <button class="btn number-btn" onclick="appendNumber('5')">5</button>
                    <button class="btn number-btn" onclick="appendNumber('6')">6</button>
                    <button class="btn function-btn" onclick="appendOperator('+')">+</button>

                    <!-- Row 4 -->
                    <button class="btn number-btn" onclick="appendNumber('1')">1</button>
                    <button class="btn number-btn" onclick="appendNumber('2')">2</button>
                    <button class="btn number-btn" onclick="appendNumber('3')">3</button>
                    <button class="btn function-btn" onclick="appendOperator('%')">%</button>

                    <!-- Row 5 -->
                    <button class="btn number-btn zero-btn" onclick="appendNumber('0')">0</button>
                    <button class="btn number-btn" onclick="appendNumber('.')">.</button>
                    <button class="btn equals-btn" onclick="calculate()">=</button>
                </div>
            </div>

            <!-- History Section -->
            <div class="history-section">
                <div class="history-header">
                    <h3>📜 History</h3>
                    <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
                </div>
                <div class="history-list" id="historyList">
                    <p class="no-history">No history yet</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
